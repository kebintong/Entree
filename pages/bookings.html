<body data-page="bookings">
  <div class="site-shell">
    <header
      class="site-header"
      style="
          background-image: url(../assets/images/ocean-background.png);
          background-size: cover;
          background-position: center top;
        ">
      <div class="site-header-left">
        <a href="index.html" class="site-logo-link" aria-label="Entree Home">
          <div class="site-logo">
            <img src="../assets/images/entree-logo.png" alt="Entree Logo" class="site-logo-img" />
          </div>
        </a>
      </div>
      <div class="site-header-actions">
        <div class="site-header-buttons">
          <a href="verify-booking.html" class="entree-pasalubong-btn" data-action="go:verify-booking">
              <span>Buy Pasalubong</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-bag" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
              </svg>
            </a>
        </div>
        <a href="login.html" class="entree-login-btn" data-action="go:login">
            <span>Log-in</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-log-in" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" x2="3" y1="12" y2="12"></line>
            </svg>
          </a>
      </div>
    </header>
    <main class="site-main">
      <div class="bookings-stack site-page">
        <div class="bookings-box bk-container">
          <div class="bookings-row bk-layout">
            <div class="bookings-box-2 bk-main">
              <div class="bookings-box-3">
                <h2 class="bookings-upcoming-trips-heading">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="bookings-icon lucide lucide-ship">
                    <path d="M12 10.189V14"></path>
                    <path d="M12 2v3"></path>
                    <path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"></path>
                    <path
                      d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76">
                    </path>
                    <path
                      d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1">
                    </path>
                  </svg>Upcoming Trips
                </h2>
                <div class="bookings-stack-2">
                </div>
              </div>
              <div>
                <h2 class="bookings-past-trips-heading">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="bookings-icon-2 lucide lucide-clock">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>Past Trips
                </h2>
                <div class="bookings-stack-2">
                </div>
              </div>
            </div>
            <div class="bookings-box-4 bk-aside">
              <div class="bookings-card-2 bk-calendar">
                <!-- Date Header -->
                <div class="bookings-row-2">
                  <div>
                    <span class="bookings-today-text tracking-wider">Today</span>
                    <p id="pht-date-str" class="bookings-today-date text-[#1f2937]">Mon, Sep 21, 2026</p>
                  </div>
                  <button data-action="month:today" class="bookings-today-button hover:text-gray-900" title="Jump to today">
                    Today
                  </button>
                </div>
                <div class="bookings-row-3">
                  <button class="bookings-previous-month-button" data-action="month:-1" aria-label="Previous month">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                      class="bookings-icon-3 lucide lucide-chevron-left">
                      <path d="m15 18-6-6 6-6"></path>
                    </svg>
                  </button>
                  <h3 class="bookings-month-label text-[#1f2937]">
                    Sep 2026
                  </h3>
                  <button class="bookings-previous-month-button" data-action="month:1" aria-label="Next month">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                      class="bookings-icon-3 lucide lucide-chevron-right">
                      <path d="m9 18 6-6-6-6"></path>
                    </svg>
                  </button>
                </div>
                <div class="bookings-grid">
                </div>
                <div class="bookings-stack-3">
                  <div class="bookings-row-4">
                    <div class="bookings-box-5"></div>
                    <span class="bookings-trip-dates-text">Trip dates</span>
                  </div>
                  <div class="bookings-row-4">
                    <div class="bookings-box-6"></div>
                    <span class="bookings-trip-dates-text">Today</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="mascot" aria-hidden="true">
      <div class="mascot-bubble"></div>
      <div class="mascot-art"></div>
    </div>
