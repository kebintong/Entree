<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Entree</title>
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/site.css" />
  <link rel="stylesheet" href="../assets/css/turtle.css" />
  <link rel="stylesheet" href="../assets/css/login.css" />
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/booking-state.js" defer></script>
    <script src="../assets/js/login.js" defer></script>
    <script src="../assets/js/app.js" defer></script>
    <script src="../assets/js/dev-panel.js" defer></script>
    <script src="../assets/js/turtle.js" defer></script>
    <script src="../assets/js/booking-flow.js" defer></script>
    <link rel="stylesheet" href="../assets/css/booking-flow.css" />
  <link rel="icon" type="image/png" href="../assets/images/entree-logo.png" />
</head>

<body data-page="login">
  <div class="site-shell">
    <header
      class="site-header"
      style="
          background-image: url(../assets/images/ocean-background.png);
          background-size: cover;
          background-position: center top;
        ">
      <div class="site-header-left">
        <a href="index.html" class="site-logo-link" aria-label="Entree Home">
          <div class="site-logo">
            <img src="../assets/images/entree-logo.png" alt="Entree Logo" class="site-logo-img" />
          </div>
        </a>
      </div>
      <div class="site-header-actions">
        <div class="site-header-buttons">
          <a href="verify-booking.html" class="entree-pasalubong-btn" data-action="go:verify-booking">
              <span>Buy Pasalubong</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-bag" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
              </svg>
            </a>
        </div>
        <a href="login.html" class="entree-login-btn" data-action="go:login">
            <span>Log-in</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-log-in" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" x2="3" y1="12" y2="12"></line>
            </svg>
          </a>
      </div>
    </header>
    <main class="site-main">
      <div class="login-stack site-page">
        <div class="login-box">
          <div class="login-card">
            <div class="login-box-2">
              <div class="login-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="login-icon lucide lucide-log-in">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                  <polyline points="10 17 15 12 10 7"></polyline>
                  <line x1="15" x2="3" y1="12" y2="12"></line>
                </svg>
              </div>
              <h1 class="login-welcome-back-title">
                Welcome back
              </h1>
              <p class="login-text">
                Sign in to manage bookings, reschedule trips, and track pasalubong orders.
              </p>
            </div>
            <form class="login-form">
              <div>
                <label class="login-email-address-label">Email
                  Address</label>
                <div class="login-box-3">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="login-icon-2 lucide lucide-mail">
                    <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                  </svg>
                  <input type="email" class="login-field-input" placeholder="Enter your email" value="" />
                </div>
              </div>
              <div>
                <label class="login-email-address-label">Password</label>
                <div class="login-box-3">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="login-icon-2 lucide lucide-lock">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <input type="password" class="login-field-input" placeholder="Enter your password" value="" />
                </div>
              </div>
              <div class="login-row">
                <label class="login-remember-me-label">
                  <input type="checkbox" class="login-field-input-2" />
                  <span class="login-remember-me-text">Remember me</span>
                </label>
                <a href="#" class="login-forgot-password-link">Forgot
                  password?</a>
              </div>
              <button type="submit" class="login-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="login-icon-3 lucide lucide-log-in">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                  <polyline points="10 17 15 12 10 7"></polyline>
                  <line x1="15" x2="3" y1="12" y2="12"></line>
                </svg>
                <span>Log In</span>
              </button>
            </form>
            <div class="login-box-4">
              <p class="login-dont-have-text">
                Don't have an account?
                <a class="login-signup-link" href="signup.html" data-discover="true">Sign
                  up</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="mascot" aria-hidden="true">
      <div class="mascot-bubble"></div>
      <div class="mascot-art"></div>
    </div>
  </div>
</body>

</html>
