<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Entree</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/site.css" />
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/app.js" defer></script>
</head>

<body data-page="login">
  <div
    class="flex flex-col min-h-screen font-sans text-slate-900 bg-white selection:bg-[#CCFF00] selection:text-black overflow-x-hidden">
    <header
      class="fixed top-0 left-0 w-full z-50 px-6 md:px-10 py-4 flex justify-between items-center h-20 transition-all duration-300 shadow-md border-b border-white/10"
      style="
          background-image: url(../assets/images/ocean-background.png);
          background-size: cover;
          background-position: center top;
        ">
      <div class="flex-1 flex items-center">
        <a href="index.html" class="inline-flex items-center focus:outline-none" aria-label="Entree Home">
          <div class="w-10 h-10 shrink-0">
            <img src="../assets/images/entree-logo.png" alt="Entree Logo" class="w-full h-full object-contain block" />
          </div>
        </a>
      </div>
      <div class="flex items-center space-x-4 md:space-x-5 shrink-0 justify-end">
        <div class="flex flex-col gap-2 items-end">
          <a href="verify-booking.html" class="entree-pasalubong-btn" data-action="go:verify-booking">
              <span>Buy Pasalubong</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-bag" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
              </svg>
            </a>
        </div>
        <a href="login.html" class="entree-login-btn" data-action="go:login">
            <span>Log-in</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-log-in" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" x2="3" y1="12" y2="12"></line>
            </svg>
          </a>
      </div>
    </header>
    <main class="flex-1 flex flex-col relative w-full h-full">
      <div class="w-full flex-1 bg-white flex flex-col items-center justify-center px-6 pt-20">
        <div class="w-full max-w-[480px] mx-auto">
          <div class="bg-white rounded-lg border border-[#dbdcd9] p-8 shadow-sm">
            <div class="mb-8 text-center">
              <div class="w-16 h-16 bg-[#CCFF00] rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-log-in w-8 h-8 text-black stroke-[2.5]">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                  <polyline points="10 17 15 12 10 7"></polyline>
                  <line x1="15" x2="3" y1="12" y2="12"></line>
                </svg>
              </div>
              <h1 class="font-['Poppins:SemiBold',sans-serif] text-[28px] text-[#363636] mb-2">
                Welcome Back
              </h1>
              <p class="text-[15px] text-[#999] font-['Poppins:Regular',sans-serif]">
                Log in to manage your bookings
              </p>
            </div>
            <form class="space-y-5">
              <div>
                <label class="block text-[14px] font-['Poppins:Medium',sans-serif] text-[#363636] mb-2">Email
                  Address</label>
                <div class="relative">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-mail absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-[#999]">
                    <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                  </svg>
                  <input type="email"
                    class="w-full pl-12 pr-4 py-3 border border-[#dbdcd9] rounded-lg font-['Poppins:Regular',sans-serif] text-[15px] focus:outline-none focus:border-[#CCFF00] focus:ring-2 focus:ring-[#CCFF00]/20"
                    placeholder="Enter your email" value="" />
                </div>
              </div>
              <div>
                <label class="block text-[14px] font-['Poppins:Medium',sans-serif] text-[#363636] mb-2">Password</label>
                <div class="relative">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-lock absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-[#999]">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <input type="password"
                    class="w-full pl-12 pr-4 py-3 border border-[#dbdcd9] rounded-lg font-['Poppins:Regular',sans-serif] text-[15px] focus:outline-none focus:border-[#CCFF00] focus:ring-2 focus:ring-[#CCFF00]/20"
                    placeholder="Enter your password" value="" />
                </div>
              </div>
              <div class="flex items-center justify-between text-[14px]">
                <label class="flex items-center cursor-pointer">
                  <input type="checkbox" class="mr-2 w-4 h-4 accent-[#CCFF00]" />
                  <span class="text-[#666] font-['Poppins:Regular',sans-serif]">Remember me</span>
                </label>
                <a href="#" class="text-black font-['Poppins:Medium',sans-serif]">Forgot
                  password?</a>
              </div>
              <button type="submit"
                class="w-full bg-[#CCFF00] hover:bg-[#B8E600] disabled:bg-gray-200 disabled:text-gray-400 text-black font-bold rounded-full py-3.5 px-6 flex justify-center items-center gap-2 transition-all shadow-sm disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-log-in w-5 h-5 stroke-[2.5]">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                  <polyline points="10 17 15 12 10 7"></polyline>
                  <line x1="15" x2="3" y1="12" y2="12"></line>
                </svg>
                <span>Log In</span>
              </button>
            </form>
            <div class="mt-6 text-center">
              <p class="text-[14px] text-[#666] font-['Poppins:Regular',sans-serif]">
                Don't have an account?
                <a class="text-black font-['Poppins:SemiBold',sans-serif]" href="signup.html" data-discover="true">Sign
                  up</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="mascot" aria-hidden="true">
      <div class="mascot-bubble"></div>
      <div class="mascot-art"></div>
    </div>
  </div>
</body>

</html>
