<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signup | Entree</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <script src="../assets/js/data.js" defer></script>
    <script src="../assets/js/app.js" defer></script>
  </head>
  <body data-page="signup">
    <div
      class="flex flex-col min-h-screen font-sans text-slate-900 bg-white selection:bg-[#CCFF00] selection:text-black overflow-x-hidden"
    >
      <header
        class="fixed top-0 left-0 w-full z-50 px-6 md:px-10 py-4 flex justify-between items-center h-20 transition-all duration-300 shadow-md border-b border-white/10"
        style="
          background-image: url(../assets/images/ocean-background.png);
          background-size: cover;
          background-position: center top;
        "
      >
        <div class="flex-1 flex items-center">
          <button
            class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-sm flex items-center justify-center text-white transition-all border border-white/20 shadow-sm"
            aria-label="Go back"
            data-action="back"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-arrow-left w-5 h-5 stroke-[2.5]"
            >
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
          </button>
        </div>
        <div class="flex items-center space-x-4 md:space-x-5 shrink-0 justify-end">
          <div class="flex flex-col gap-2 items-end">
            <a
              class="border-2 border-[#FFCC00] text-[#FFCC00] text-[12px] md:text-[13px] font-bold rounded-full px-6 py-2 flex items-center justify-center shadow-sm"
              href="verify-booking.html"
              data-discover="true"
              >Buy Pasalubong</a
            >
          </div>
          <button
            class="border-2 border-[#CCFF00] text-[#CCFF00] text-[12px] md:text-[13px] font-bold rounded-full px-6 py-2 flex items-center space-x-2 shadow-sm"
            data-action="go:login"
          >
            <span>Log-in</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-log-in w-4 h-4 stroke-[2.5]"
            >
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" x2="3" y1="12" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>
      <main class="flex-1 flex flex-col relative w-full h-full">
        <div class="w-full flex-1 bg-white flex flex-col items-center pt-20">
          <div class="w-full max-w-[800px] mx-auto px-6 py-8">
            <div class="mb-8">
              <h1
                class="font-['Poppins:SemiBold',sans-serif] text-[32px] text-[#363636] mb-2"
              >
                Create Your Account
              </h1>
              <p class="font-['Poppins:Regular',sans-serif] text-[14px] text-[#979797]">
                Fill in your information to get started with Entree
              </p>
            </div>
            <form class="space-y-6">
              <div class="bg-white border border-[#dbdcd9] rounded-[8px] p-6">
                <h2
                  class="font-['Poppins:SemiBold',sans-serif] text-[18px] text-[#363636] mb-4"
                >
                  Personal Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >First Name *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-user absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                      </svg>
                      <input
                        type="text"
                        name="firstName"
                        required=""
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        placeholder="Juan"
                        value=""
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >Last Name *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-user absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                      </svg>
                      <input
                        type="text"
                        name="lastName"
                        required=""
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        placeholder="dela Cruz"
                        value=""
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >Birthdate *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-calendar absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <path d="M8 2v4"></path>
                        <path d="M16 2v4"></path>
                        <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                        <path d="M3 10h18"></path>
                      </svg>
                      <input
                        type="date"
                        name="birthdate"
                        required=""
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        value=""
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >Phone Number *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-phone absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <path
                          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                        ></path>
                      </svg>
                      <input
                        type="tel"
                        name="phone"
                        required=""
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        placeholder="+63 917-1234-567"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <div class="bg-white border border-[#dbdcd9] rounded-[8px] p-6">
                <h2
                  class="font-['Poppins:SemiBold',sans-serif] text-[18px] text-[#363636] mb-4"
                >
                  Address
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="md:col-span-2">
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >Street Address *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-map-pin absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <path
                          d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
                        ></path>
                        <circle cx="12" cy="10" r="3"></circle>
                      </svg>
                      <input
                        type="text"
                        name="address"
                        required=""
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        placeholder="123 Main Street, Barangay Guadalupe"
                        value=""
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >City *</label
                    >
                    <input
                      type="text"
                      name="city"
                      required=""
                      class="w-full px-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                      placeholder="Cebu City"
                      value=""
                    />
                  </div>
                </div>
              </div>
              <div class="bg-white border border-[#dbdcd9] rounded-[8px] p-6">
                <h2
                  class="font-['Poppins:SemiBold',sans-serif] text-[18px] text-[#363636] mb-4"
                >
                  Account Security
                </h2>
                <div class="grid grid-cols-1 gap-4">
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >Email Address *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-mail absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                      </svg>
                      <input
                        type="email"
                        name="email"
                        required=""
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        placeholder="juan@example.com"
                        value=""
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >Password *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-lock absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                      </svg>
                      <input
                        type="password"
                        name="password"
                        required=""
                        minlength="8"
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        placeholder="Min. 8 characters"
                        value=""
                      />
                    </div>
                  </div>
                  <div>
                    <label
                      class="block font-['Poppins:Medium',sans-serif] text-[12px] text-[#363636] mb-2"
                      >Confirm Password *</label
                    >
                    <div class="relative">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-lock absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-[#979797]"
                      >
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                      </svg>
                      <input
                        type="password"
                        name="confirmPassword"
                        required=""
                        minlength="8"
                        class="w-full pl-10 pr-4 py-3 border border-[#dbdcd9] rounded-[4px] font-['Poppins:Regular',sans-serif] text-[14px] text-[#363636] focus:outline-none focus:border-[#007f70] transition-colors"
                        placeholder="Re-enter password"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <div class="space-y-4">
                <div class="flex items-start gap-3">
                  <input
                    type="checkbox"
                    id="terms"
                    required=""
                    class="mt-1 w-4 h-4 border-[#dbdcd9] rounded text-[#007f70] focus:ring-[#007f70]"
                  />
                  <label
                    for="terms"
                    class="font-['Poppins:Regular',sans-serif] text-[12px] text-[#363636]"
                    >I agree to the
                    <span class="text-[#007f70] underline cursor-pointer"
                      >Terms and Conditions</span
                    >
                    and <span class="text-[#007f70] underline cursor-pointer">Privacy Policy</span>
                  </label>
                </div>
                <button
                  type="submit"
                  class="w-full bg-[#b2f510] hover:bg-[#a0dd0f] active:bg-[#8fc50d] text-black font-['Poppins:Medium',sans-serif] text-[14px] rounded-full py-4 flex items-center justify-center gap-2 border-2 border-white shadow-md transition-all"
                >
                  <span>Create Account</span>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-arrow-right w-5 h-5 stroke-[2.5]"
                  >
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                  </svg>
                </button>
                <p
                  class="text-center font-['Poppins:Regular',sans-serif] text-[12px] text-[#979797]"
                >
                  Already have an account?
                  <span
                    class="text-[#007f70] underline cursor-pointer hover:text-[#006659]"
                    data-action="go:login"
                    >Log in</span
                  >
                </p>
              </div>
            </form>
          </div>
        </div>
      </main>
