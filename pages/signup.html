<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup | Entree</title>
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/site.css" />
  <link rel="stylesheet" href="../assets/css/turtle.css" />
  <link rel="stylesheet" href="../assets/css/signup.css" />
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/booking-state.js" defer></script>
    <script src="../assets/js/signup.js" defer></script>
    <script src="../assets/js/app.js" defer></script>
    <script src="../assets/js/dev-panel.js" defer></script>
    <script src="../assets/js/turtle.js" defer></script>
    <script src="../assets/js/booking-flow.js" defer></script>
    <link rel="stylesheet" href="../assets/css/booking-flow.css" />
  <link rel="icon" type="image/png" href="../assets/images/entree-logo.png" />
</head>

<body data-page="signup">
  <div class="site-shell">
    <header
      class="site-header"
      style="
          background-image: url(../assets/images/ocean-background.png);
          background-size: cover;
          background-position: center top;
        ">
      <div class="site-header-left">
        <a href="index.html" class="site-logo-link" aria-label="Entree Home">
          <div class="site-logo">
            <img src="../assets/images/entree-logo.png" alt="Entree Logo" class="site-logo-img" />
          </div>
        </a>
      </div>
      <div class="site-header-actions">
        <div class="site-header-buttons">
          <a href="verify-booking.html" class="entree-pasalubong-btn" data-action="go:verify-booking">
            <span>Buy Pasalubong</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-shopping-bag" aria-hidden="true">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
              <path d="M3 6h18" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          </a>
        </div>
        <a href="login.html" class="entree-login-btn" data-action="go:login">
          <span>Log-in</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-log-in" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" x2="3" y1="12" y2="12"></line>
          </svg>
        </a>
      </div>
    </header>
    <main class="site-main">
      <div class="signup-stack site-page">
        <div class="signup-box">
          <div class="signup-box-2">
            <h1 class="signup-create-account-title">
              Create Your Account
            </h1>
            <p class="signup-text">
              Join Entree to book ferry trips, manage reservations, and pre-order pasalubong in one place.
            </p>
          </div>
          <form class="signup-form">
            <div class="signup-card">
              <h2 class="signup-personal-information-heading">
                Personal Information
              </h2>
              <div class="signup-grid">
                <div>
                  <label class="signup-first-name-label">First Name
                    *</label>
                  <div class="signup-box-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="signup-icon lucide lucide-user">
                      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" name="firstName" required=""
                      class="signup-field-input"
                      placeholder="Your first name" value="" />
                  </div>
                </div>
                <div>
                  <label class="signup-first-name-label">Last Name
                    *</label>
                  <div class="signup-box-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="signup-icon lucide lucide-user">
                      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" name="lastName" required=""
                      class="signup-field-input"
                      placeholder="Your last name" value="" />
                  </div>
                </div>
                <div>
                  <input type="date" name="birthdate" required="" value="" max="" data-date-field="Birthdate *"
                    data-min-year="1920" aria-label="Birthdate" />
                </div>
                <div>
                  <label class="signup-first-name-label">Phone Number
                    *</label>
                  <div class="signup-box-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="signup-icon lucide lucide-phone">
                      <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                      </path>
                    </svg>
                    <input type="tel" name="phone" required=""
                      class="signup-field-input"
                      placeholder="+63 917 123 4567" value="" />
                  </div>
                </div>
              </div>
            </div>
            <div class="signup-card">
              <h2 class="signup-personal-information-heading">
                Address
              </h2>
              <div class="signup-grid">
                <div class="signup-box-4">
                  <label class="signup-first-name-label">Street Address
                    *</label>
                  <div class="signup-box-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="signup-icon lucide lucide-map-pin">
                      <path
                        d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0">
                      </path>
                      <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <input type="text" name="address" required=""
                      class="signup-field-input"
                      placeholder="Unit / house no., street, barangay" value="" />
                  </div>
                </div>
                <div>
                  <label class="signup-first-name-label">City *</label>
                  <input type="text" name="city" required=""
                    class="signup-field-input-2"
                    placeholder="City or municipality" value="" />
                </div>
              </div>
            </div>
            <div class="signup-card">
              <h2 class="signup-personal-information-heading">
                Account Security
              </h2>
              <div class="signup-grid-2">
                <div>
                  <label class="signup-first-name-label">Email Address
                    *</label>
                  <div class="signup-box-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="signup-icon lucide lucide-mail">
                      <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                    <input type="email" name="email" required=""
                      class="signup-field-input"
                      placeholder="name@email.com" value="" />
                  </div>
                </div>
                <div>
                  <label class="signup-first-name-label">Password
                    *</label>
                  <div class="signup-box-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="signup-icon lucide lucide-lock">
                      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" name="password" required="" minlength="8"
                      class="signup-field-input"
                      placeholder="At least 8 characters" value="" />
                  </div>
                </div>
                <div>
                  <label class="signup-first-name-label">Confirm
                    Password *</label>
                  <div class="signup-box-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="signup-icon lucide lucide-lock">
                      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" name="confirmPassword" required="" minlength="8"
                      class="signup-field-input"
                      placeholder="Re-enter your password" value="" />
                  </div>
                </div>
              </div>
            </div>
            <div class="signup-stack-2">
              <div class="signup-row">
                <input type="checkbox" id="terms" required="" class="signup-terms-checkbox" />
                <label for="terms" class="signup-terms-label">I agree to the
                  <span class="signup-terms-conditions-text">Terms and Conditions</span>
                  and <span class="signup-terms-conditions-text">Privacy Policy</span>
                </label>
              </div>
              <button type="submit" class="signup-create-account-button">
                <span>Create Account</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="signup-icon-2 lucide lucide-arrow-right">
                  <path d="M5 12h14"></path>
                  <path d="m12 5 7 7-7 7"></path>
                </svg>
              </button>
              <p class="signup-already-have-text">
                Already have an account?
                <span class="signup-login-text" data-action="go:login">Log in</span>
              </p>
            </div>
          </form>
        </div>
      </div>
    </main>
    <div class="mascot" aria-hidden="true">
      <div class="mascot-bubble"></div>
      <div class="mascot-art"></div>
    </div>
  </div>
</body>

</html>
