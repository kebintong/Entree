<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pasalubong | Entree</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/site.css" />
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/booking-state.js" defer></script>
    <script src="../assets/js/app.js" defer></script>
    <script src="../assets/js/booking-flow.js" defer></script>
    <link rel="stylesheet" href="../assets/css/booking-flow.css" />
  <link rel="icon" type="image/png" href="../assets/images/entree-logo.png" />
</head>

<body data-page="pasalubong">
  <div
    class="flex flex-col min-h-screen font-sans text-slate-900 bg-white selection:bg-[#CCFF00] selection:text-black overflow-x-hidden">
    <header
      class="fixed top-0 left-0 w-full z-50 px-6 md:px-10 py-4 flex justify-between items-center h-20 transition-all duration-300 shadow-md border-b border-white/10"
      style="
          background-image: url(../assets/images/ocean-background.png);
          background-size: cover;
          background-position: center top;
        ">
      <div class="flex-1 flex items-center">
        <a href="index.html" class="inline-flex items-center focus:outline-none" aria-label="Entree Home">
          <div class="w-10 h-10 shrink-0">
            <img
              src="../assets/images/entree-logo.png"
              alt="Entree Logo"
              class="w-full h-full object-contain block"
            />
          </div>
        </a>
      </div>
      <div class="flex items-center space-x-4 md:space-x-5 shrink-0 justify-end">
        <div class="flex flex-col gap-2 items-end">
          <a href="bookings.html" class="entree-pasalubong-btn" data-action="go:bookings">
              <span>My Bookings</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-calendar" aria-hidden="true">
                <path d="M8 2v4" />
                <path d="M16 2v4" />
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M3 10h18" />
              </svg>
            </a>
        </div>
        <a href="login.html" class="entree-login-btn" data-action="go:login">
            <span>Log-in</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-log-in" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" x2="3" y1="12" y2="12"></line>
            </svg>
          </a>
      </div>
    </header>
    <main class="flex-1 flex flex-col relative w-full h-full">
      <div class="w-full bg-gray-50 flex-1 flex flex-col items-center pb-20 pt-20">
        <!-- Delivery promise strip -->
        <div class="pz-strip">
          <span class="pz-strip-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10.189V14"/><path d="M12 2v3"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
            Delivered to your seat
          </span>
          <span class="pz-strip-dot" aria-hidden="true"></span>
          <span class="pz-strip-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Arrives on your travel day
          </span>
          <span class="pz-strip-dot" aria-hidden="true"></span>
          <span class="pz-strip-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            Free delivery with your trip
          </span>
        </div>

        <div class="pz-layout">
          <!-- Shop -->
          <section class="pz-shop" aria-labelledby="pz-title">
            <div class="pz-trip" id="pz-trip" hidden></div>
            <h1 class="pz-title" id="pz-title">Shop Pasalubong</h1>
            <p class="pz-subtitle">Pre-order local treats and souvenirs. We'll hand them to you at your seat before the ferry leaves.</p>

            <div class="pz-toolbar">
              <div class="pz-chips" role="tablist" aria-label="Categories" id="pz-chips"></div>
              <label class="pz-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="search" id="pz-search" placeholder="Search treats and gifts" aria-label="Search pasalubong" />
              </label>
            </div>

            <div class="pz-grid" id="pz-grid" aria-live="polite"></div>
            <p class="pz-noresults" id="pz-noresults" hidden>No items match your search. Try another word or category.</p>
          </section>

          <!-- Cart -->
          <aside class="pz-cart" id="pz-cart" aria-labelledby="pz-cart-title">
            <div class="pz-cart-head">
              <span class="pz-cart-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              </span>
              <h2 class="pz-cart-title" id="pz-cart-title">Your Add-ons</h2>
              <span class="pz-cart-count" id="pz-cart-count" hidden>0</span>
            </div>
            <div id="pz-cart-body"></div>
          </aside>
        </div>

        <!-- Mobile cart bar -->
        <button type="button" class="pz-mobilebar" id="pz-mobilebar" hidden>
          <span id="pz-mobilebar-count">0 items</span>
          <span class="pz-mobilebar-total" id="pz-mobilebar-total">₱0</span>
          <span class="pz-mobilebar-cta">View cart</span>
        </button>
      </div>
    </main>
    <div class="mascot" aria-hidden="true">
      <div class="mascot-bubble"></div>
      <div class="mascot-art"></div>
    </div>
  </div>
</body>

</html>
