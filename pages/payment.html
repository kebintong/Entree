<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment | Entree</title>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/turtle.css" />
    <link rel="stylesheet" href="../assets/css/payment.css" />
    <script src="../assets/js/data.js" defer></script>
    <script src="../assets/js/booking-state.js" defer></script>
    <script src="../assets/js/payment.js" defer></script>
    <script src="../assets/js/app.js" defer></script>
    <script src="../assets/js/dev-panel.js" defer></script>
    <script src="../assets/js/turtle.js" defer></script>
    <script src="../assets/js/booking-flow.js" defer></script>
    <link rel="stylesheet" href="../assets/css/booking-flow.css" />
    <link rel="icon" type="image/png" href="../assets/images/entree-logo.png" />
</head>
  <body data-page="payment">
    <div class="site-shell">
      <header
        class="site-header"
        style="
          background-image: url(../assets/images/ocean-background.png);
          background-size: cover;
          background-position: center top;
        "
      >
        <div class="site-header-left">
          <a href="index.html" class="site-logo-link" aria-label="Entree Home">
            <div class="site-logo">
              <img src="../assets/images/entree-logo.png" alt="Entree Logo" class="site-logo-img" />
            </div>
          </a>
        </div>
        <div class="site-header-actions">
          <div class="site-header-buttons">
            <a href="verify-booking.html" class="entree-pasalubong-btn" data-action="go:verify-booking">
              <span>Buy Pasalubong</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-bag" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
              </svg>
            </a>
          </div>
          <a href="login.html" class="entree-login-btn" data-action="go:login">
            <span>Log-in</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-log-in" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" x2="3" y1="12" y2="12"></line>
            </svg>
          </a>
        </div>
      </header>
      <main class="site-main">
        <div class="payment-stack site-page">
          <div class="payment-box">
            <div class="payment-box-2">
              <div class="payment-box-3">
                <div class="payment-row">
                  <div class="payment-box-4">
                    <button class="payment-go-back-button" data-action="back">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="payment-icon lucide lucide-chevron-left"
                      >
                        <path d="m15 18-6-6 6-6"></path>
                      </svg>
                    </button>
                  </div>
                  <div class="payment-box-5">
                    <div class="payment-stack-2">
                      <div class="payment-stack-3">
                        <div class="payment-row-2">
                          <p class="payment-search-text">
                            Search
                          </p>
                        </div>
                        <div class="payment-circle"></div>
                      </div>
                    </div>
                  </div>
                  <div class="payment-box-6">
                    <svg class="payment-icon-2" fill="none" viewBox="0 0 19 15.033">
                      <path
                        d="M11.2764 0.322266L18.3223 7.36816L11.2764 14.4141"
                        stroke="#363636"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                      <path
                        d="M0.677734 7.36816H18.3223"
                        stroke="#363636"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </div>
                  <div class="payment-box-5">
                    <div class="payment-stack-2">
                      <div class="payment-stack-3">
                        <div class="payment-row-2">
                          <p class="payment-search-text">
                            Trips
                          </p>
                        </div>
                        <div class="payment-circle"></div>
                      </div>
                    </div>
                  </div>
                  <div class="payment-box-6">
                    <svg class="payment-icon-2" fill="none" viewBox="0 0 19 15.033">
                      <path
                        d="M11.2764 0.322266L18.3223 7.36816L11.2764 14.4141"
                        stroke="#363636"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                      <path
                        d="M0.677734 7.36816H18.3223"
                        stroke="#363636"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </div>
                  <div class="payment-box-5">
                    <div class="payment-stack-2">
                      <div class="payment-stack-3">
                        <div class="payment-row-2">
                          <p class="payment-search-text">
                            Passenger Details
                          </p>
                        </div>
                        <div class="payment-circle"></div>
                      </div>
                    </div>
                  </div>
                  <div class="payment-box-6">
                    <svg class="payment-icon-2" fill="none" viewBox="0 0 19 15.033">
                      <path
                        d="M11.2764 0.322266L18.3223 7.36816L11.2764 14.4141"
                        stroke="#363636"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                      <path
                        d="M0.677734 7.36816H18.3223"
                        stroke="#363636"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </div>
                  <div class="payment-box-5">
                    <div class="payment-stack-2">
                      <div class="payment-stack-3">
                        <p class="payment-text">
                          Payment
                        </p>
                        <div class="payment-circle-2"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="payment-box-7">
            <div class="payment-card">
              <div class="payment-box-8">
                <h1 class="payment-title">
                  Payment
                </h1>
                <p class="payment-box-9">
                  Select your preferred payment method
                </p>
              </div>
              <div class="payment-card-2">
                <div class="payment-row-3">
                  <span class="payment-total-amount-text">Total Amount</span
                  >
                  <span data-booking-total class="payment-text-2">₱ 4,359.80</span
                  >
                </div>
              </div>
              <div class="payment-stack-4">
                <h3 class="payment-select-payment-method-subheading">
                  Select Payment Method
                </h3>
                <button
                  class="payment-gcash-instant-payment-button hover:ring-2 hover:ring-[#CCFF00]/20"
                  data-action="payment:gcash"
                >
                  <div class="payment-row-4">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="payment-icon-3 lucide lucide-credit-card"
                    >
                      <rect width="20" height="14" x="2" y="5" rx="2"></rect>
                      <line x1="2" x2="22" y1="10" y2="10"></line>
                    </svg>
                  </div>
                  <div class="payment-box-10">
                    <div class="payment-box-11">
                      GCash
                    </div>
                    <div class="payment-box-9">
                      Instant payment via GCash
                    </div>
                  </div>
                </button>
                <button
                  class="payment-gcash-instant-payment-button hover:ring-2 hover:ring-[#CCFF00]/20"
                  data-action="payment:bank"
                >
                  <div class="payment-row-5">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="payment-icon-3 lucide lucide-building2 lucide-building-2"
                    >
                      <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                      <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                      <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                      <path d="M10 6h4"></path>
                      <path d="M10 10h4"></path>
                      <path d="M10 14h4"></path>
                      <path d="M10 18h4"></path>
                    </svg>
                  </div>
                  <div class="payment-box-10">
                    <div class="payment-box-11">
                      Online Banking
                    </div>
                    <div class="payment-box-9">
                      Pay via your bank account
                    </div>
                  </div>
                </button>
              </div>
              <button disabled="" class="payment-complete-payment-button" data-action="complete-payment">
                <span>Complete Payment</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="payment-icon-4 lucide lucide-arrow-right"
                >
                  <path d="M5 12h14"></path>
                  <path d="m12 5 7 7-7 7"></path>
                </svg>
              </button>
              <div class="payment-preview-note">
                <div class="payment-box-12">
                  <svg class="payment-icon-5" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                </div>
                <div class="payment-box-13">
                  <p class="payment-text-3">
                    Your payment information is secure and encrypted. You will be redirected to your
                    payment provider to complete the transaction.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div class="mascot" aria-hidden="true">
        <div class="mascot-bubble"></div>
        <div class="mascot-art"></div>
      </div>
    </div>
  </body>
</html>
